表12項高於8項，午後雷暴發生機率極高。"},{"text":"地面觀測 (局部效應)\n探空 (綜觀環境)，不利對流發展條件必須低於門檻。\n持續性"}],"img":"data:image/webp;base64,UklGRlhSAQBXRUJQVlA4IExSAQDQ1gOdASp+BIcCPoE8mEklIyKhJreqgKAQCWlu/Fl8MsxhWjfibzKvMTPMq/QT8a2Ssgrsjn4V/av6N/af1o/s3xS+KfrP9Z/uv+U/vX9w/9X+b9s/xL5h+w/2r/H/4f+2f+//OfDb/V/2z/B/7P1uerfyP+m/xX+w/8/uh/IvsB9u/tX+N/2v9k/db7kfsv92/uf+c/yX+K/aL2d/Pf3D/Kf4r9sv8v+6v2C/jv8h/s39r/yv+u/tX7y/X58//of9b/pP9//hv//5XWm/6D/Wf5X9rP7N///oF9U/m3+J/u3+S/5/99/e76Efg/9P/bv8r/u/3/+SP0D+1f6P/Cf5T/q/5H///8/9AP5J/P/8v/b/8r/4v8R////N92f5T/i/4n96PSL+1/6v/j/538j/sC/lf9f/6f+I/0P7h/Sz/Gf8//Hf6T/5/57///+r4y/mn+G/6/+U/1H/4/0X////X6F/yz+tf8L+//6b/7f5r////z7yP/h7r/2n//37Z/Kp+1H/2/P///lJIBalecgbATKyIkW+HCfuaadtNiWOIu47XQZIW3q2lOV/REwhsKViW9+QiuBLe/IRXAlvfkIrgS3vyEVwJb35CK4Evqh7jdf5Fu4/RWiKSRSbKjV0cbH1g7RgFqbGmgOkX492JNuS8enDXQtJtCS8W5R5bj/osFQUw19scDWqj/s23aBDucMU95LacfWfTjHIpV91z9/2a6PGedMYP0fv7rI7aFwPt2YjdkLa4rI4oeFibvl9MsNpMsiM1DESMCvjpLWGf1yLWFCuk6GfXKsgUm/3iAvNC6Juzy7uvnT4OXDwI3xWP5pYpNuitNgQSUq5w1/0+qcIlcCrV753Q5g+Fca0aiT2GbA2nLo7neHxwoFmXPhNzmGSdz2zNLW3HP6QpUK3ZFbQcB/TprkcDV153JbtdefqigTJiLP0yoED2p9MTt/QqEBEGpkVIlbLpZIriv/l28FnRxDw6HmKmwYqEqs98tNwdUtmxb/cD/n3InmqVSaF6vIDbC4vjF+lHolZOKR15P1AsS2iJh153D/zqPS5111u6xnjJLcl6lo88TPpNX4uqGSTXVKiVilb/VkTorMXwQTVJxXHa6oOuTycYEfD+T8w0F/0zEkZS2UXgU8dZNLJddbwv4wpxLDf9+ccArsSQA0lO4tnt4InnEZyEG5seKVOCx2OoaKfcFsbaO4t5ln/v9/v11XsNPXu/suxOYMxG92chDBapZfzLM6IO/WILenWPfw7Da9OPQB52Gqhs2BJloVp7NtgdMn3DwVCloJHyaEuYl82vAGHeOpiuNpdcs8ZQxgjOzmFzt4PQiJfAnr1uEvYaj+orv1xEZn6/w+SENZWGD8DLN2V+B4rj2a/afo71r0O3MvuMxPMEFmqT1UXAnlioYqk3miVklm+N/6brMw3UiWpyYvPUdv4XRs4G24dY0c61IPCBnEPlSZPLHi1LlaGkdTSV96YWFx7sfjMKEq9RWMsFmD+JL0kO7Of2RP89HqfM1DWqxbT81yxNIi8ZrUpOWqCO08JWX1OOR5Q6mT61IS+Y1bcMjZN/qWi7q9Ivtw7W3u1HbHqHM8dF3KQYkCkV5SKawk4QYyTsWFPMc2K4ng2YsfCJAVB8x2YzSUz7rQISTQLn2cEgjalou6t+bsAOk1KkrEgNnTlu4E6T75hbpUWN/71yk04vvYgR8SgMvt2lFsauPQhOlph3/TAZk22eY0cWbh281sZQJ/LD3blnFDf/BpKcNOurtuUH9XjOwDr1GuP/4vjhiYfn02gupG6bN2jgyf7kr4DoE7qHGHtzylhjyO37OQVUpBzzFJCifJGpWAf2mWsBBotiDGHupajYKN5+o0
